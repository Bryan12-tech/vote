# Render Blueprint — Votebook Management System (free tier)
#
# Provisions:
#   1. One free web service: serves the built React frontend AND the Express API
#      from a single process (no CORS needed; /api is same-origin).
#   2. One free PostgreSQL database, wired to the service via DATABASE_URL.
#
# Deploy: push this repo to GitHub/GitLab, then in Render: New + → Blueprint →
# select the repo → Apply. See https://render.com/docs/blueprint-spec

services:
  - type: web
    name: votebook-app
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm build
    # Seed runs at every start (idempotent) so the database bootstraps itself
    startCommand: node server/seed.js && node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: votebook-db
          property: connectionString

databases:
  - name: votebook-db
    databaseName: votebook
    user: votebook
    plan: free
    region: frankfurt